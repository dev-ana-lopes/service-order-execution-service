services:
  api:
    image: service-order-execution-service:dev
    build: .
    container_name: service-order-execution-service
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8003:8000"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment: &app_environment
      APP_RUNTIME_MODE: ${DOCKER_APP_RUNTIME_MODE:-real}
      MONGODB_URL: ${DOCKER_MONGODB_URL:-mongodb://mongo:27017/service_order}
      RABBITMQ_URL: ${DOCKER_RABBITMQ_URL:-amqp://guest:guest@host.docker.internal:5672/%2F}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_NAME: ${APP_NAME:-service-order-execution-service}
      APP_VERSION: ${APP_VERSION:-2.1.0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8003}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-SMTP}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8003}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@localhost}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_AUTH: ${SMTP_USE_AUTH:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      APPROVAL_TOKEN_SECRET: ${APPROVAL_TOKEN_SECRET:-dev-approval-secret-with-32-characters}
      APPROVAL_TOKEN_SECRET_FILE: ${APPROVAL_TOKEN_SECRET_FILE:-}
      APPROVAL_TOKEN_TTL_MINUTES: ${APPROVAL_TOKEN_TTL_MINUTES:-60}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-with-at-least-32-chars}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      HEALTHCHECK_TIMEOUT_SECONDS: ${HEALTHCHECK_TIMEOUT_SECONDS:-5}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-service-order.events}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-service-order.execution}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-service-order.execution.events}
      RABBITMQ_CONSUME_ROUTING_KEYS: ${RABBITMQ_CONSUME_ROUTING_KEYS:-service-order.os}
    depends_on:
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    networks:
      - service-order-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: service-order-execution-service:dev
    build: .
    container_name: service-order-execution-worker
    command: ["python", "-m", "src.worker"]
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      <<: *app_environment
    depends_on:
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    networks:
      - service-order-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app

  mongo:
    image: mongo:7
    container_name: service-order-execution-mongo
    ports:
      - "27018:27017"
    networks:
      - service-order-network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/service_order", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: service-order-execution-mailhog
    ports:
      - "1027:1025"
      - "8027:8025"
    networks:
      - service-order-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:

networks:
  service-order-network:
    driver: bridge
