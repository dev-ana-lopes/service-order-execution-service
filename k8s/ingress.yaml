apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-order-execution-service
  namespace: service-order
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: service-order-execution-service
                port:
                  number: 80

